# Fast stage (#269): runs on every pull request and on manual dispatch.
# Frontend: typecheck + unit tests without a browser. Ruby: targeted specs without the long game runs.
# Browser job (#277): the *-browser tests, shot and ipad on the runner's Chrome; fails if any is skipped.
# The full suite is in full.yml (push to main, manual). No secrets, no deploy.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund
      - run: npm run typecheck
      # Unit tests only: the *-browser tests, shot and ipad need a browser (full stage).
      - name: unit tests (no browser)
        run: |
          files=$(ls test/*.test.ts | grep -v -E '(-browser|^test/shot|^test/ipad)')
          node --test $files

  browser:
    name: browser (Chrome, iPad profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund
      # The tests start $OE_BROWSER without --headless (locally chromium-headless-shell); the runner's
      # preinstalled Google Chrome gets a thin headless wrapper. bin/shot --device ipad uses the Chromium
      # iPad profile (viewport, DPR 2, touch, UA); real WebKit (.tools/pw) is not installed here.
      - name: headless Chrome wrapper
        run: |
          wrapper="$RUNNER_TEMP/chrome-headless"
          printf '#!/bin/sh\nexec "%s" --headless=new --no-sandbox "$@"\n' "$(command -v google-chrome)" > "$wrapper"
          chmod +x "$wrapper"
          echo "OE_BROWSER=$wrapper" >> "$GITHUB_ENV"
          google-chrome --version
      # The browser tests skip silently without a browser: here a skip is a failure, so a green check
      # means they really ran. The counts stay visible in the log.
      - name: browser tests (no skips allowed)
        run: |
          files=$(ls test/*.test.ts | grep -E '(-browser|^test/shot|^test/ipad)')
          echo "$files"
          set +e +o pipefail  # the runner shell is -e -o pipefail: keep going to report the result
          node --test --test-reporter=tap $files | tee "$RUNNER_TEMP/browser.tap"
          status=${PIPESTATUS[0]}
          grep -E '^# (tests|pass|fail|skipped) ' "$RUNNER_TEMP/browser.tap"
          # Failing and skipped tests also as annotations (readable without the raw log).
          grep -E '^ *(not ok|ok .*# SKIP)' "$RUNNER_TEMP/browser.tap" | head -30 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          grep -E -A12 '^ *not ok' "$RUNNER_TEMP/browser.tap" | grep -E 'error:|message|expected|actual|Error' | head -20 | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
          if ! grep -q '^# skipped 0$' "$RUNNER_TEMP/browser.tap"; then echo "::error::browser tests were skipped"; exit 1; fi
          if grep -q '^# tests 0$' "$RUNNER_TEMP/browser.tap"; then echo "::error::no browser tests ran"; exit 1; fi
          exit $status
        shell: bash

  ruby:
    name: ruby (targeted specs, contracts) ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # spec/web_spec.rb serves web/dist and checks web/view-keys.json against lib/oe/view.rb.
      - run: npm ci --no-progress --no-audit --no-fund && npm run build
        working-directory: web
      - name: specs without the long game runs (shard)
        run: |
          # shard ${{ matrix.shard }} of 3: every 3rd spec file, so shards stay roughly equal
          files=$(find spec -name '*_spec.rb' -not -path 'spec/engine/*' -not -name script_game_spec.rb -not -name playthrough_spec.rb -not -name bot_simulation_spec.rb -not -name enumeration_timing_spec.rb | sort | awk -v n=${{ matrix.shard }} 'NR%3==n%3')
          echo "$files"
          bundle exec rspec $files
