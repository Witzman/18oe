# Fast stage (#269, #365): runs on every pull request and on manual dispatch. Target: wall time under 3 min.
# Frontend: typecheck + unit tests without a browser (they hold the contract tests text.test.ts and the
# view-keys drift test). Ruby: every example that does not play a seed game or a recorded log
# (--tag ~game_flow, see spec/support/tags.rb), engine specs and the contract examples of spec/web_spec.rb included.
# Browser job (#277): the *-browser tests, shot and ipad on the runner's Chrome (touch-browser excluded: milestone
# stage); fails if any is skipped. The job ALWAYS runs so that it can be a required check; a `changes` job decides
# whether web/** was touched, and if not, its steps are skipped and it ends green.
# Everything that plays a game (:game_flow, :full_game), touch-browser, the scripted game: milestone stage, full.yml
# (nightly, tag v0.*, manual for any SHA). No secrets, no deploy.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts of the pull request changed (no third-party action: git diff against the merge base).
  changes:
    name: changes (which stages apply)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          # The nightly refresh PR (#439) gets this stage by dispatch on its branch (a PR opened with GITHUB_TOKEN
          # starts no pull_request run); it changes only stored logs, so no browser tests.
          case "${{ github.event_name }}:${{ github.ref_name }}" in
            workflow_dispatch:refresh/catalog-*) echo "web=false" >> "$GITHUB_OUTPUT"; echo "refresh branch: logs only, browser tests skipped"; exit 0 ;;
          esac
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"; echo "not a pull request: browser tests run"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "$files"
          # web/** = everything the browser tests exercise (they use stub servers, no Ruby code);
          # plus the files that define this job.
          if echo "$files" | grep -q -E '^(web/|\.github/workflows/ci\.yml$|\.github/scripts/browser-tests\.sh$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"; echo "::notice::no web/** change: browser tests skipped (they run in the milestone stage)"
          fi
      # Guard (#365 B6): stored catalog logs change only in a refresh PR (branch refresh/catalog-*), never in a
      # feature PR. Lives in this job (a required check) so that no new required check is needed.
      - name: guard (catalog logs only in a refresh PR)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          logs=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- spec/fixtures/games/logs/)
          if [ -z "$logs" ]; then echo "no catalog log changed"; exit 0; fi
          case "$HEAD_REF" in
            refresh/catalog-*) echo "refresh PR ($HEAD_REF): log changes allowed"; echo "$logs"; exit 0 ;;
          esac
          echo "$logs"
          echo "::error::this pull request changes stored catalog logs (spec/fixtures/games/logs/*). Logs are written only by a catalog refresh PR (branch refresh/catalog-*), which the nightly catalog-refresh run opens by itself, see README 'CI stages'. Drop the log changes and write 'Katalog-Refresh noetig' in the PR description instead."
          exit 1
      # #564: lib/engine is generated by bin/engine-sync; a hand edit fails here (offline, stdlib Ruby only).
      - name: engine-check (lib/engine matches engine/MANIFEST)
        run: ruby bin/engine-check

  web:
    name: web (typecheck, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund
      - run: npm run typecheck
      # Unit tests only: the *-browser tests, shot and ipad need a browser (full stage).
      - name: unit tests (no browser)
        run: |
          files=$(ls test/*.test.ts | grep -v -E '(-browser|^test/shot|^test/ipad)')
          node --test $files

  browser:
    name: browser (Chrome, iPad profile) ${{ matrix.shard }}/3
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.web == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: needs.changes.outputs.web == 'true'
        run: npm ci --no-progress --no-audit --no-fund
      # The tests start $OE_BROWSER without --headless (locally chromium-headless-shell); the runner's
      # preinstalled Google Chrome gets a thin headless wrapper. bin/shot --device ipad uses the Chromium
      # iPad profile (viewport, DPR 2, touch, UA); real WebKit (.tools/pw) is not installed here.
      - name: no web/** change
        if: needs.changes.outputs.web != 'true'
        working-directory: ${{ runner.temp }} # no checkout in this case, so no web/ directory
        run: echo 'no web change, browser tests skipped, this check passes'
      - name: headless Chrome wrapper
        if: needs.changes.outputs.web == 'true'
        run: |
          wrapper="$RUNNER_TEMP/chrome-headless"
          printf '#!/bin/sh\nexec "%s" --headless=new --no-sandbox --disable-dev-shm-usage "$@"\n' "$(command -v google-chrome)" > "$wrapper"
          chmod +x "$wrapper"
          echo "OE_BROWSER=$wrapper" >> "$GITHUB_ENV"
          google-chrome --version
      # The browser tests skip silently without a browser: here a skip is a failure. One node process per
      # file, a failing file is retried once; first failures stay visible as annotations (.github/scripts).
      - name: "browser tests (no skips allowed, flaky files retried once, touch-browser is in the milestone stage)"
        if: needs.changes.outputs.web == 'true'
        run: ../.github/scripts/browser-tests.sh
        shell: bash
        env:
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_SHARDS: 3
          BROWSER_SKIP: touch-browser

  ruby:
    name: ruby (fast specs, contracts) ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # spec/web_spec.rb serves web/dist and checks web/view-keys.json against lib/oe/view.rb.
      - run: npm ci --no-progress --no-audit --no-fund && npm run build
        working-directory: web
      - name: fast specs (--tag ~game_flow), engine specs and contracts included (shard)
        run: |
          # time-balanced shard (.github/scripts/shard.rb, timings in .github/rspec-timings.json). No file
          # exclusion list: the game-playing examples are tagged :game_flow and drop out by tag (the same selection as
          # `bin/test fast`); files that are wholly :game_flow are not even handed to rspec (SHARD_SKIP_TAG, so their
          # time does not skew the shards). Everything tagged :game_flow runs in full.yml.
          files=$(SHARD_SKIP_TAG=game_flow ruby .github/scripts/shard.rb ${{ matrix.shard }} 4 '')
          echo "$files"
          bundle exec rspec $files --tag ~game_flow --format progress --format json --out "$RUNNER_TEMP/rspec.json"
      - name: per-file timings (to refresh .github/rspec-timings.json)
        if: always()
        run: ruby .github/scripts/shard.rb --report "$RUNNER_TEMP/rspec.json"
      - name: failed examples
        if: always()
        run: ruby .github/scripts/rspec-failures.rb "$RUNNER_TEMP/rspec.json"
      - name: rspec.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-json-${{ github.job }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/rspec.json
          if-no-files-found: ignore
          retention-days: 14
