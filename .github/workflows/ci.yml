# Fast stage (#269): runs on every pull request and on manual dispatch.
# Frontend: typecheck + unit tests without a browser. Ruby: targeted specs without the long game runs.
# Browser job (#277): the *-browser tests, shot and ipad on the runner's Chrome; fails if any is skipped.
# The full suite is in full.yml (push to main, manual). No secrets, no deploy.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund
      - run: npm run typecheck
      # Unit tests only: the *-browser tests, shot and ipad need a browser (full stage).
      - name: unit tests (no browser)
        run: |
          files=$(ls test/*.test.ts | grep -v -E '(-browser|^test/shot|^test/ipad)')
          node --test $files

  browser:
    name: browser (Chrome, iPad profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund
      # The tests start $OE_BROWSER without --headless (locally chromium-headless-shell); the runner's
      # preinstalled Google Chrome gets a thin headless wrapper. bin/shot --device ipad uses the Chromium
      # iPad profile (viewport, DPR 2, touch, UA); real WebKit (.tools/pw) is not installed here.
      - name: headless Chrome wrapper
        run: |
          wrapper="$RUNNER_TEMP/chrome-headless"
          printf '#!/bin/sh\nexec "%s" --headless=new --no-sandbox --disable-dev-shm-usage "$@"\n' "$(command -v google-chrome)" > "$wrapper"
          chmod +x "$wrapper"
          echo "OE_BROWSER=$wrapper" >> "$GITHUB_ENV"
          google-chrome --version
      # The browser tests skip silently without a browser: here a skip is a failure. One node process per
      # file, a failing file is retried once; first failures stay visible as annotations (.github/scripts).
      - name: browser tests (no skips allowed, flaky files retried once)
        run: ../.github/scripts/browser-tests.sh
        shell: bash

  ruby:
    name: ruby (targeted specs, contracts) ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # spec/web_spec.rb serves web/dist and checks web/view-keys.json against lib/oe/view.rb.
      - run: npm ci --no-progress --no-audit --no-fund && npm run build
        working-directory: web
      - name: specs without the long game runs and view_railroad_phase_spec (195 s, full stage) (shard)
        run: |
          # time-balanced shard (.github/scripts/shard.rb, timings in .github/rspec-timings.json)
          files=$(ruby .github/scripts/shard.rb ${{ matrix.shard }} 3 '(^spec/engine/|script_game_spec|playthrough_spec|bot_simulation_spec|enumeration_timing_spec|view_railroad_phase_spec)')
          echo "$files"
          bundle exec rspec $files --format json --out "$RUNNER_TEMP/rspec.json"
      - name: per-file timings (to refresh .github/rspec-timings.json)
        if: always()
        run: ruby .github/scripts/shard.rb --report "$RUNNER_TEMP/rspec.json"
