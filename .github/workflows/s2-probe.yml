# TEMPORARY (#481): the exact command of the job script-game-s2. Removed before the PR is merged.
name: s2-probe
on:
  push:
    branches: ["feature/481-s2"]
jobs:
  probe:
    name: s2 exact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: |
          rc=0
          bundle exec ruby -I lib bin/script_game.rb --spawn --slice s2 > "$RUNNER_TEMP/out.txt" 2> "$RUNNER_TEMP/err.txt" || rc=$?
          { echo "exit $rc"; head -3 "$RUNNER_TEMP/out.txt"; sed -n '/^Target/,/^Offered/p' "$RUNNER_TEMP/out.txt"; sed -n '/^Problems/,$p' "$RUNNER_TEMP/out.txt" | head -8; } > "$RUNNER_TEMP/sum.txt"
          echo "::notice title=s2 exact::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$RUNNER_TEMP/sum.txt")"
          exit $rc
