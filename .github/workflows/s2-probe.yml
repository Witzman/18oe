# TEMPORARY (#481): measures which S2 targets a rush game reaches. Removed before the PR is merged.
name: s2-probe
on:
  push:
    branches: ["feature/481-s2"]
jobs:
  probe:
    name: s2 probe ${{ matrix.args }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        args: ["--seed 2", "--seed 3", "--seed 4", "--players 3", "--players 5", "--players 6"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: run
        run: |
          rc=0
          bundle exec ruby -I lib bin/script_game.rb --spawn --slice s2 --max-actions 6000 ${{ matrix.args }} > "$RUNNER_TEMP/out.txt" 2> "$RUNNER_TEMP/err.txt" || rc=$?
          echo "exit $rc"
          # annotations: head, then the missing and offered-not-taken sections, one line each
          { head -3 "$RUNNER_TEMP/out.txt"; sed -n '/^Executed/,/^Offered/p' "$RUNNER_TEMP/out.txt" | grep -v -E 'BuySellParShares/choose|TransferTokens'; sed -n '/^Target combinations missing/,/^GET /p' "$RUNNER_TEMP/out.txt"; sed -n '/^Problems/,$p' "$RUNNER_TEMP/out.txt" | head -12; } | grep -v '^$' > "$RUNNER_TEMP/sum.txt"
          echo "::notice title=s2 probe ${{ matrix.args }}::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$RUNNER_TEMP/sum.txt")"
