# Full stage (#269): push to main and manual dispatch. Complete rspec suite, frontend incl. browser
# tests (Chromium), scripted game. No secrets, no deploy.
name: full

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *" # nightly (#335)
  workflow_dispatch:
    inputs:
      docker:
        description: "also build the Docker image (no push)"
        type: boolean
        default: false

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: false # long runs (#335): a later merge must not cancel them

permissions:
  contents: read

jobs:
  rspec:
    name: rspec (complete suite) ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund && npm run build
        working-directory: web
      - name: rspec shard
        run: |
          # time-balanced shard (.github/scripts/shard.rb); complete suite across the shards
          files=$(ruby .github/scripts/shard.rb ${{ matrix.shard }} 4 '')
          echo "$files"
          bundle exec rspec $files --format json --out "$RUNNER_TEMP/rspec.json"
      - name: per-file timings
        if: always()
        run: ruby .github/scripts/shard.rb --report "$RUNNER_TEMP/rspec.json"

  # Long whole-game specs (#314, #335): run here with the caps lifted (OE_FULL_GAME=1, 30000 actions, the game
  # plays to its end, phase 8 included). The pull-request stage runs the same specs with GAME_CAP/STRATEGY_CAP
  # (spec/engine/engine_helper.rb). One runner per spec; fail-fast off so one red run does not hide the others.
  long-games:
    name: long game ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: view_spec, args: "spec/oe/view_spec.rb" }
          - { name: view_order_spec, args: "spec/oe/view_order_spec.rb" }
          - { name: bot_spec, args: "spec/oe/bot_spec.rb" }
          - { name: whole bot game, args: "spec/oe/bot_runner_spec.rb --tag full_game" }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund && npm run build
        working-directory: web
      - run: bundle exec rspec ${{ matrix.args }}
        env:
          OE_FULL_GAME: "1"

  web:
    name: web (typecheck, unit and browser tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund
        working-directory: web
      # bin/shot and the browser tests start $OE_BROWSER without --headless (the local browser is
      # chromium-headless-shell). The runner's Google Chrome gets a thin headless wrapper.
      - name: headless Chrome wrapper
        run: |
          wrapper="$RUNNER_TEMP/chrome-headless"
          printf '#!/bin/sh\nexec "%s" --headless=new --no-sandbox --disable-dev-shm-usage "$@"\n' "$(command -v google-chrome)" > "$wrapper"
          chmod +x "$wrapper"
          echo "OE_BROWSER=$wrapper" >> "$GITHUB_ENV"
          google-chrome --version
      - run: npm run typecheck
        working-directory: web
      - name: unit tests (no browser)
        run: node --test $(ls test/*.test.ts | grep -v -E '(-browser|^test/shot|^test/ipad)')
        working-directory: web
      - name: browser tests (flaky files retried once)
        run: ../.github/scripts/browser-tests.sh
        working-directory: web

  script-game:
    name: scripted game (bin/script-game --spawn)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec ruby -I lib bin/script_game.rb --spawn

  docker:
    name: docker build (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t 18oe:ci .
