# Milestone stage (#269, #365): the complete suite, i.e. everything the pull-request stage (ci.yml) leaves out.
# NOT run on every push to main any more (merge chains cancelled 25 runs). Triggers:
#   - nightly (schedule, 02:17 UTC, default branch)
#   - tag v0.* (a version milestone)
#   - workflow_dispatch for any commit: input `sha` (empty = the selected ref). This is how "before a deploy" (and,
#     on request, a batch of merges) is started (README, section CI stages). Not dispatched after every merge (#439):
#     the nightly run is read in the morning; red rule tests there are a P1 fix before new work.
#   After the nightly run, catalog-refresh.yml rebuilds the stored catalog logs and opens the refresh PR itself.
# Content: all rspec examples (the :game_flow ones included), the long whole games uncapped, all browser tests
# (touch-browser included), the scripted game. No secrets, no deploy.
name: full

on:
  push:
    tags: ["v0.*"]
  schedule:
    - cron: "17 2 * * *" # nightly (#335)
  workflow_dispatch:
    inputs:
      sha:
        description: "commit (SHA) to test; empty = the ref selected above"
        type: string
        default: ""
      docker:
        description: "also build the Docker image (no push)"
        type: boolean
        default: false

concurrency:
  group: full-${{ inputs.sha || github.ref }}
  cancel-in-progress: false # long runs (#335); one group per tested commit, so two SHAs never cancel each other

permissions:
  contents: read

jobs:
  rspec:
    name: rspec (complete suite) ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund && npm run build
        working-directory: web
      - name: rspec shard
        run: |
          # time-balanced shard (.github/scripts/shard.rb); the complete suite across the shards (all tags, the
          # :game_flow examples too; :full_game only runs in the long-games job). Excluded here: view_spec,
          # view_order_spec, bot_spec, because the long-games job below runs those three whole files again with the
          # caps lifted (OE_FULL_GAME=1: the same examples, only the loop cap differs), so the capped run adds nothing.
          # Also excluded: fixture_catalog_spec, invariants_spec. The job `catalog live` runs both whole files against
          # fresh games of the current engine; here they would only replay the stored logs, and a stored log that is
          # merely stale is no defect and no gate (#439, refreshed nightly by catalog-refresh.yml).
          files=$(ruby .github/scripts/shard.rb ${{ matrix.shard }} 4 'spec/oe/(view_spec|view_order_spec|bot_spec|fixture_catalog_spec|invariants_spec)\.rb$')
          echo "$files"
          bundle exec rspec $files --format progress --format json --out "$RUNNER_TEMP/rspec.json"
      - name: per-file timings
        if: always()
        run: ruby .github/scripts/shard.rb --report "$RUNNER_TEMP/rspec.json"
      - name: failed examples
        if: always()
        run: ruby .github/scripts/rspec-failures.rb "$RUNNER_TEMP/rspec.json"
      - name: rspec.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-json-${{ github.job }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/rspec.json
          if-no-files-found: ignore
          retention-days: 14

  # Fixture catalog against the CURRENT engine (#365 B6): OE_CATALOG=live plays fresh games (seed and player kind
  # from catalog.json) instead of the stored logs, so a stale log never hides a defect and never reds this job. This
  # job is the gate of the catalog (#439): the stored logs are replayed in no gate (the rspec shards leave both files
  # out); a stale stored log becomes the nightly refresh PR of catalog-refresh.yml.
  catalog-live:
    name: catalog live (fresh games)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund && npm run build
        working-directory: web
      - name: fixture catalog and invariants, live
        env:
          OE_CATALOG: live
        run: |
          start=$(date +%s)
          rc=0
          bundle exec rspec spec/oe/fixture_catalog_spec.rb spec/oe/invariants_spec.rb --format progress --format json --out "$RUNNER_TEMP/live.json" || rc=$?
          echo "OE_CATALOG=live: $(( $(date +%s) - start )) s, rspec exit $rc" | tee -a "$GITHUB_STEP_SUMMARY"
          # job logs are not readable through the API: failures become annotations
          ruby -rjson -e 'JSON.parse(File.read(ARGV[0]))["examples"].select { |e| e["status"] == "failed" }.each { |e| puts "::error title=#{e["full_description"][0, 120].tr("\n", " ")}::#{e["exception"]["message"].to_s[0, 600].gsub("\n", "%0A")}" }' "$RUNNER_TEMP/live.json"
          exit $rc

  # Long whole-game specs (#314, #335): run here with the caps lifted (OE_FULL_GAME=1, 30000 actions, the game
  # plays to its end, phase 8 included). The pull-request stage runs the same specs with GAME_CAP/STRATEGY_CAP
  # (spec/engine/engine_helper.rb). One runner per spec; fail-fast off so one red run does not hide the others.
  long-games:
    name: long game ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: view_spec, args: "spec/oe/view_spec.rb" }
          - { name: view_order_spec, args: "spec/oe/view_order_spec.rb" }
          - { name: bot_spec, args: "spec/oe/bot_spec.rb" }
          - { name: whole bot game, args: "spec/oe/bot_runner_spec.rb --tag full_game" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund && npm run build
        working-directory: web
      - run: bundle exec rspec ${{ matrix.args }}
        env:
          OE_FULL_GAME: "1"

  web:
    name: web (typecheck, unit and browser tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-progress --no-audit --no-fund
        working-directory: web
      # bin/shot and the browser tests start $OE_BROWSER without --headless (the local browser is
      # chromium-headless-shell). The runner's Google Chrome gets a thin headless wrapper.
      - name: headless Chrome wrapper
        run: |
          wrapper="$RUNNER_TEMP/chrome-headless"
          printf '#!/bin/sh\nexec "%s" --headless=new --no-sandbox --disable-dev-shm-usage "$@"\n' "$(command -v google-chrome)" > "$wrapper"
          chmod +x "$wrapper"
          echo "OE_BROWSER=$wrapper" >> "$GITHUB_ENV"
          google-chrome --version
      - run: npm run typecheck
        working-directory: web
      - name: unit tests (no browser)
        run: node --test $(ls test/*.test.ts | grep -v -E '(-browser|^test/shot|^test/ipad)')
        working-directory: web
      - name: browser tests (flaky files retried once)
        run: ../.github/scripts/browser-tests.sh
        working-directory: web

  script-game:
    name: scripted game (bin/script-game --spawn)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec ruby -I lib bin/script_game.rb --spawn

  docker:
    name: docker build (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - run: docker build -t 18oe:ci .
