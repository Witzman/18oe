services:
  app:
    build: .
    expose:
      - "80"
    restart: unless-stopped
    # Dokploy keeps these in the compose project's .env; compose only hands
    # them to the container if they are named here. The app refuses to start
    # without them (see app.rb), so a missing one fails the deploy loudly.
    volumes:
      - oe-data:/data
    environment:
      DATABASE_PATH: /data/18oe.sqlite3
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in Dokploy}
      OE_INVITE_CODE: ${OE_INVITE_CODE:?OE_INVITE_CODE must be set in Dokploy}

# SQLite lives here (action log of every game). Without it every deploy would
# delete all games.
volumes:
  oe-data:
