services:
  app:
    build: .
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.orient18oe.rule=Host(`oe.witzman.de`)
      - traefik.http.routers.orient18oe.entrypoints=websecure
      - traefik.http.routers.orient18oe.tls.certResolver=letsencrypt
      - traefik.http.services.orient18oe.loadbalancer.server.port=80

networks:
  dokploy-network:
    external: true
