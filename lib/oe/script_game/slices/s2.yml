# Target list of slice S2 (workshop #224): conversions, minor merges, the consolidation round and
# train discards, every combination round / step / action type through the API at least once.
# Format as in s1.yml; run with `bin/script-game --slice s2`.
#
# Each target is an action the enumerator offers in a state a small scenario reaches, under the key
# the script game counts (ScriptGame#key); spec/oe/s2_targets_spec.rb proves that one by one and fails
# for a target without a scenario. What the spec does NOT show: that a whole script game reaches the
# states. That is a CI run (`bin/script-game --slice s2`, not yet a step of full.yml, so a run that
# misses a target cannot turn the nightly red before it is known to reach them). A target the run never
# reaches makes the run red, so strike it from here then and say why.
#
# Train purchase between railroads and train variants (#127, #54, #354) have no key of their own: the
# script game counts operating/BuyTrain/buy_train whatever the source or variant (a S1 target), so they
# are covered by spec/oe/legal_actions_train_variants_spec.rb and spec/engine/g_18_oe/s2_train_scenarios_spec.rb.
# Forced purchase with conversion (`bankrupt`) is an S1 target. Green tiles are lay_tile (S1).
#
# CI measurement of #481 (rush games, seed 1, 3 to 6 players, plus seed 2 with 4): every game with 4 or more
# players ends regularly (bank broken) in Train Phase 4, turn 12 to 14, so the Consolidation round (it follows the
# first Level-5 train) is never played; the 3 player game reaches Phase 5 and plays it. Hence game 2 runs with
# 3 players (`players: 3` in the slice file; full.yml runs one job per game). The targets under `combos` are reached;
# the ones under `unreachable` are not.
# The director steers one thing for S2: it chooses a minor of its own for a merge (ScriptGame#start_merge, the
# choice carries the minor's id and is no target); without it stock/MergeMinor/merge was never offered.
# stock/BuySellParShares/choose:<minor id> (starting a merge) is keyed by the minor's id, so it cannot be a
# stable target; the merge is counted as stock/MergeMinor/merge.
#
# Not targets, and why (#481; read by nobody at run time, spec/oe/s2_targets_spec.rb fails if a key here becomes
# a target or has no scenario). A target the run never reaches turns the CI run red.
slice: S2
unreachable:
  consolidation/Consolidate/choose:offer_or_abandon: >-
    Offered only to the owner of a minor who has no major to merge it into and no regional. The rush games that reach the Consolidation round (game 2, 3 players, Phase 5) did not offer it (CI runs of #481); 4 to 6 player games end in Train Phase 4 before the round. A small scenario shows the enumerator offers it (spec/oe/s2_targets_spec.rb); steering a game to that state is the target-driven director of #118.
  operating/DiscardTrain/discard_train: >-
    A corporation is over its train limit only when the limit falls (Phase 4: major 4 to 3, minor and regional 2 to 1; Phase 6: major 3 to 2) while it holds more trains than the new limit. In the rush games no corporation was crowded when the Phase 4 or Phase 5 train was bought (CI runs of #481, 3 to 6 players; the Consolidation round's own discard is a different key, consolidation/DiscardTrain). A small scenario (a major with four 3-trains, spec/oe/s2_targets_spec.rb) shows the enumerator offers it; steering it is the target-driven director of #118.
games:
  - name: rush game, conversions, merges and discards
    seed: 1
    finish: false
    rush: true
    combos:
      - stock/BuySellParShares/convert
      - stock/BuySellParShares/choose:offer_or_merge
      - stock/MergeMinor/merge
      - stock/MergeOffer/choose:merge_offer
      - stock/MergeOffer/pass
      - stock/MergeToken/place_token
      - stock/MergeToken/pass
      - stock/MergeDiscardTrain/discard_train
      - stock/MergeDiscardTrain/pass
      - operating/ConvertToNational/convert
      - operating/ConvertToNational/pass
  - name: rush game with 3 players, consolidation round
    seed: 1
    finish: false
    rush: true
    players: 3
    combos:
      - consolidation/Consolidate/choose:offer_or_merge
      - consolidation/MergeOffer/choose:merge_offer
      - consolidation/MergeOffer/pass
  - name: rush game with 3 players, a regional kept for the consolidation round
    seed: 1
    finish: false
    rush: true
    players: 3
    # #492: the director keeps one regional unconverted (ScriptGame#hold_regional) so its president is offered
    # `convert` when the round starts. A game of its own, so game 2 stays as measured; NOT yet run by CI.
    combos:
      - consolidation/Consolidate/convert
