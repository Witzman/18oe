# Target list of slice S1 (notes/reference/poc-slices.md): every combination
# round / step / action type that must be executed through the API at least
# once, in one or more games. Refinements after a colon: the choice of a
# `choose`, the corporation type of par / buy_shares / sell_shares.
#
# finish: the game must end regularly (bank broken). rush: the director floats
# everything it can in the Initial SR, to reach the Major Railroad Phase early
# (only then regionals' treasury shares can be bought, see ScriptGame#rush?);
# such a game stops as soon as its combos are executed, because with 18
# regionals operating a whole game takes hours.
#
# Not listed yet (follow-up issues): player trade (§10.4, an offer the seller
# accepts since #202; the director does not steer it yet, workshop #223),
# Spielende by Level-8 etc. (S4).
#
# Not targets, and why (#235; the code facts are checked in spec/oe/s1_unreachable_spec.rb). The
# `unreachable` block below is read by nobody at run time; it is the record, and the spec fails if
# one of its keys becomes a target. A target the run never reaches turns the CI run red, so a type
# only goes into `combos` once a state that offers it is known to be reached.
slice: S1
unreachable:
  stock/BuySellParShares/buy_company: >-
    Purchase of a bank-owned private. No step of the game hands a private to the bank (G18OE::Step::BuySellParShares
    does not include the base game's company sale, companies start with no owner and leave the auction to players),
    so Game#buyable_bank_owned_companies is always empty; the player trade (buy_company:trade) is the only buy_company.
  operating/BuyTrain/sell_shares:regional: >-
    A president selling shares to pay for a train is off for every corporation type (EBUY_CAN_SELL_SHARES = false,
    §11.6.4, #354), so the step never offers sell_shares; the insolvent corporation converts instead (bankrupt, a target).
  operating/IssueShares/sell_shares:minor: >-
    Only a major issues shares (Game#issuable_shares returns nothing for minors, regionals and nationals), so the
    Issue step offers sell_shares only as sell_shares:major, which is a target.
  operating/IssueShares/buy_shares:major: >-
    Redeeming is offered only on a later turn than the issue (selling passes the Issue step, G18OE::Step::IssueShares
    #process_sell_shares) and only while the major has shares in the market and the cash for them. In the rush game the
    director makes majors withhold and pass the Issue step while bankrupt is missing (ScriptGame#starve_presidents, #434),
    so the one issuing major spends the proceeds on trains and the market share may be bought by a player first; whether
    a redeem state then occurs before the combos are done is not known without a run (CI only). A target never reached
    turns the run red, so not listed (#468); candidate once a CI run of the script game shows such an offer.
  skip: >-
    Offered only to a player whose sole possible stock action is a merge-free skip (president of a fully held major
    and owner of a minor, nothing to buy, sell or float): a state no steering of the director produces on purpose.
    The engine treats it as an auto action; no seeded game is known to reach it.
  operating/OrientExpressBonus/choose: >-
    Needs a train running the Orient Express route to Constantinople for the first time (§ Orient Express bonus):
    a late-game state (slice S5), not reachable inside the rush game and not steerable in the whole game.
games:
  - name: whole game
    seed: 1
    finish: true
    combos:
      - auction/WaterfallAuction/bid
      - auction/WaterfallAuction/pass
      - concession/Concession/par:regional
      - concession/Concession/par:minor
      - concession/HomeToken/place_token
      - stock/BuySellParShares/par:minor
      - stock/BuySellParShares/par:regional
      - stock/BuySellParShares/pass
      - stock/BuySellParShares/choose:remove_private
      - stock/BuySellParShares/choose:flip_private
      - stock/BuySellParShares/choose:remove
      - stock/BuySellParShares/choose:reserve
      - stock/BuySellParShares/buy_company:trade
      - stock/BuySellParShares/buy_corporation
      - stock/TradeOffer/choose:accept_trade
      - stock/TradeOffer/pass
      - stock/HomeToken/place_token
      - operating/Track/lay_tile
      - operating/Track/pass
      - operating/Token/place_token
      - operating/Token/pass
      - operating/Route/run_routes
      - operating/Dividend/dividend
      - operating/BuyTrain/buy_train
      - operating/BuyTrain/pass
  - name: initial stock round, major phase, issue step
    seed: 1
    finish: false
    rush: true
    combos:
      - stock/BuySellParShares/par:regional
      - stock/BuySellParShares/buy_shares:regional
      - stock/ReserveShare/choose:reserve
      - stock/ReserveShare/pass
      # then on, with majors operating: Issue step (§11.7) and a major that
      # must buy a train but whose treasury and president cannot pay converts
      # into a national (§11.6.4, `bankrupt`; #354, #421). The president may
      # not sell shares to buy a train any more, so BuyTrain/sell_shares is no
      # target. To get there the director makes majors withhold and not
      # issue while this target is missing (ScriptGame#starve_presidents, #434).
      - operating/IssueShares/pass
      - operating/IssueShares/sell_shares:major
      - operating/BuyTrain/choose:national
