# Target list of slice S1 (notes/reference/poc-slices.md): every combination
# round / step / action type that must be executed through the API at least
# once, in one or more games. Refinements after a colon: the choice of a
# `choose`, the corporation type of par / buy_shares / sell_shares.
#
# finish: the game must end regularly (bank broken). rush: the director floats
# everything it can in the Initial SR, to reach the Major Railroad Phase early
# (only then regionals' treasury shares can be bought, see ScriptGame#rush?);
# such a game stops as soon as its combos are executed, because with 18
# regionals operating a whole game takes hours.
#
# Not reachable, so not listed (follow-up issues): player trade (§10.4, off
# until #148: buy_company/buy_corporation of another player's company are
# refused by the engine), Spielende by Level-8 etc. (S4).
slice: S1
games:
  - name: whole game
    seed: 1
    finish: true
    combos:
      - auction/WaterfallAuction/bid
      - auction/WaterfallAuction/pass
      - concession/Concession/par:regional
      - concession/Concession/par:minor
      - concession/HomeToken/place_token
      - stock/BuySellParShares/par:minor
      - stock/BuySellParShares/par:regional
      - stock/BuySellParShares/pass
      - stock/BuySellParShares/choose:remove_private
      - stock/BuySellParShares/choose:flip_private
      - stock/BuySellParShares/choose:remove
      - stock/BuySellParShares/choose:reserve
      - stock/HomeToken/place_token
      - operating/Track/lay_tile
      - operating/Track/pass
      - operating/Token/place_token
      - operating/Token/pass
      - operating/Route/run_routes
      - operating/Dividend/dividend
      - operating/BuyTrain/buy_train
      - operating/BuyTrain/pass
  - name: initial stock round up to the major phase
    seed: 1
    finish: false
    rush: true
    combos:
      - stock/BuySellParShares/par:regional
      - stock/BuySellParShares/buy_shares:regional
      - stock/ReserveShare/choose:reserve
      - stock/ReserveShare/pass
